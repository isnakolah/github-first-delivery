name: Source install proof

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  source-install:
    name: ${{ matrix.os }} source install
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - name: Install from source
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/gfd-bin"
          mkdir -p "$install_root"
          GOBIN="$install_root" go install ./cmd/gfd
          "$install_root/gfd" version
          "$install_root/gfd" doctor --json
      - name: Validate bundled plugins
        shell: bash
        run: |
          set -euo pipefail
          bash -n plugins/codex/github-first-delivery/scripts/session-context
          bash -n plugins/codex/github-first-delivery/scripts/pre-write-guard
          bash -n plugins/claude/github-first-delivery/scripts/session-context
          bash -n plugins/claude/github-first-delivery/scripts/pre-write-guard
          python3 -m json.tool plugins/codex/github-first-delivery/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/claude/github-first-delivery/.claude-plugin/plugin.json >/dev/null
